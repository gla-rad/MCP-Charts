# EKS cluster definition for the MCP platform.
#
# This file is a template rather than a ready to run config: the ids belong to
# a particular deployment, so they are substituted at call time instead of
# being committed. eksctl rejects every command line flag when -f is set
# ("cannot use --name when --config-file/-f is set"), but it will read the
# config from stdin, so the values are injected with envsubst:
#
#   envsubst < config/aws/mcp-cluster.yaml | eksctl create cluster -f -
#
# See "Create the EKS cluster" in README.md for the block that fills the
# variables straight from the mcp-vpc stack outputs.
#
# The cluster and node IAM roles already exist in the account and are reused
# here rather than being created by eksctl.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  # CLUSTER_NAME must match the ClusterName parameter used for the mcp-vpc
  # stack, since that is what builds the kubernetes.io/cluster/<name> subnet
  # tags. When the two disagree, the cluster comes up fine but load balancer
  # provisioning fails with "could not find any suitable subnets for creating
  # the ELB" - the cloud controller skips subnets tagged for another cluster.
  name: ${CLUSTER_NAME}
  region: eu-west-2
  version: "1.36"

iam:
  # Cluster IAM role: needs AmazonEKSClusterPolicy and a trust relationship
  # with eks.amazonaws.com.
  serviceRoleARN: arn:aws:iam::322828184358:role/AmazonEKSMCPClusterRole

vpc:
  id: ${VPC_ID}
  subnets:
    public:
      eu-west-2a: { id: ${PUBLIC_SUBNET_1} }
      eu-west-2b: { id: ${PUBLIC_SUBNET_2} }
      eu-west-2c: { id: ${PUBLIC_SUBNET_3} }
    private:
      eu-west-2a: { id: ${PRIVATE_SUBNET_1} }
      eu-west-2b: { id: ${PRIVATE_SUBNET_2} }
      eu-west-2c: { id: ${PRIVATE_SUBNET_3} }

managedNodeGroups:
  - name: mcp-nodes
    instanceType: t3.large
    desiredCapacity: 3
    # Keeps the workers in the private subnets, which is the point of the
    # split subnet layout.
    privateNetworking: true
    iam:
      # Node IAM role: needs AmazonEKSWorkerNodePolicy,
      # AmazonEC2ContainerRegistryReadOnly and AmazonEKS_CNI_Policy, and a
      # trust relationship with ec2.amazonaws.com.
      instanceRoleARN: arn:aws:iam::322828184358:role/AmazonEKSMCPNodeRole
