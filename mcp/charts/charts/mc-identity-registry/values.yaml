# Default values for mc-identity-registry.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  #
  # Common Variables
  #
  keycloak_url: "http://localhost/mcp"
  keycloak_realm: "MCP"

  # The Identity Registry Chart
  mc_identity_registry:
    #
    # Input Files
    #
    configuration: ""
    keycloak_json: ""
    keystore: ""
    truststore: ""
    #
    # Credentials
    #
    # Leave empty to keep whatever spring.datasource holds in the mounted
    # application.yaml. Anything set here is exported as a SPRING_DATASOURCE_*
    # environment variable, which takes precedence over the file.
    db_username: ""
    db_password: ""
    #
    # Other Configuration
    #
    db_url: ""

replicaCount: 1

image:
  repository: ghcr.io/maritimeconnectivity/identityregistry
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "mcp-admin"

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8443

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: mc-identity-registry.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

waitForServices:
  - serviceName: mc-keycloak
    servicePort: 8090

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# livenessProbe:
#  httpGet:
#    path: /
#    port: http
# readinessProbe:
#  httpGet:
#    path: /
#    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# The datasource entries are marked optional, so when the corresponding values
# are left empty the keys are never written and the container falls back to the
# spring.datasource block of the mounted application.yaml.
env:
- name: SPRING_DATASOURCE_URL
  valueFrom:
    configMapKeyRef:
      name: mc-identity-registry-config
      key: mir_database_url
      optional: true
- name: SPRING_DATASOURCE_USERNAME
  valueFrom:
    secretKeyRef:
      name: mc-identity-registry-secrets
      key: mir_database_username
      optional: true
- name: SPRING_DATASOURCE_PASSWORD
  valueFrom:
    secretKeyRef:
      name: mc-identity-registry-secrets
      key: mir_database_password
      optional: true

# Additional volumes on the output Deployment definition.
volumes:
- name: config-volume
  projected:
    sources:
    - secret:
        name: mc-identity-registry-secrets
        items:
        - key: mir_api_subca_keystore
          path: subca-keystore.jks
    - secret:
        name: mc-identity-registry-secrets
        items:
        - key: mir_api_truststore
          path: mcp-truststore.jks
    - secret:
        name: mc-identity-registry-secrets
        items:
        - key: mir_api_config
          path: application.yaml
    - secret:
        name: mc-identity-registry-secrets
        items:
        - key: mir_api_keycloak_json
          path: keycloak.json

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
- name: config-volume
  mountPath: "/conf"
  readOnly: true

nodeSelector: {
  "kubernetes.io/os": linux
}

tolerations: []

affinity: {}
