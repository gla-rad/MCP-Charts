# Default values for mc-service-registry.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:

  #
  # Common Variables
  #
  keycloak_url: "http://localhost"
  keycloak_realm: "MCP"

  # The Service Registry Chart
  mc_service_registry:
    #
    # Input Files
    #
    own_edge_router_keystore: ""
    secom_signing_identity_keystore: ""
    secom_truststore: ""
    #
    # Credentials
    #
    db_username: "admin"
    db_password: "changeit"
    keycloak_client_secret: "changeit"
    own_edge_router_keystore_password: "changeit"
    secom_signing_identity_keystore_password: "changeit"
    secom_truststore_password: "changeit"
    #
    # Other Configuration
    #
    db_type: "postgresql"
    db_host: "localhost"
    db_port: 5432
    db_name: "mcp_service_registry"
    keycloak_client_id: "mcpsvreg"
    mir_root_ca_alias: "mcp-root"

replicaCount: 1

image:
  repository: glarad/mc-service-registry
  #repository: ghcr.io/maritimeconnectivity/serviceregistry
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "mcp-admin"

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8444

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: mc-service-registry.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

waitForServices:
  - serviceName: mc-keycloak
    servicePort: 8090

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

env:
- name: DATABASE_SERVER_TYPE
  valueFrom:
    configMapKeyRef:
      name: mc-service-registry-config
      key: msr_database_type
- name: DATABASE_SERVER_HOST
  valueFrom:
    configMapKeyRef:
      name: mc-service-registry-config
      key: msr_database_host
- name: DATABASE_SERVER_PORT
  valueFrom:
    configMapKeyRef:
      name: mc-service-registry-config
      key: msr_database_port
- name: DATABASE_NAME
  valueFrom:
    configMapKeyRef:
      name: mc-service-registry-config
      key: msr_database_name
- name: DATABASE_USERNAME
  valueFrom:
    secretKeyRef:
      name: mc-service-registry-secrets
      key: msr_database_username
- name: DATABASE_PASSWORD
  valueFrom:
    secretKeyRef:
      name: mc-service-registry-secrets
      key: msr_database_password
- name: KEYCLOAK_SERVER_URL
  valueFrom:
    configMapKeyRef:
      name: mc-service-registry-config
      key: keycloak_url
- name: KEYCLOAK_CLIENT_REALM
  valueFrom:
    configMapKeyRef:
      name: mc-service-registry-config
      key: keycloak_realm
- name: KEYCLOAK_CLIENT_ID
  valueFrom:
    configMapKeyRef:
      name: mc-service-registry-config
      key: msr_keycloak_client_id
- name: KEYCLOAK_CLIENT_SECRET
  valueFrom:
    secretKeyRef:
      name: mc-service-registry-secrets
      key: msr_keycloak_client_secret
- name: MCP_MIR_URL
  valueFrom:
    configMapKeyRef:
      name: mc-service-registry-config
      key: mcp_identity_registry_api_url
- name: MIR_TRUSTSTORE_PATH
  value: /conf/secom_truststore.jks
- name: MIR_TRUSTSTORE_PASSWORD
  valueFrom:
    secretKeyRef:
      name: mc-service-registry-secrets
      key: secom_truststore_password
- name: MIR_ROOT_CA_ALIAS
  valueFrom:
    configMapKeyRef:
      name: mc-service-registry-config
      key: mir-root-ca-alias
- name: OWN_EDGE_ROUTER_KEYSTORE_PATH
  value: /conf/own_edge_router_keystore.jks
- name: OWN_EDGE_ROUTER_KEYSTORE_PASSWORD
  valueFrom:
    secretKeyRef:
      name: mc-service-registry-secrets
      key: own_edge_router_keystore_password
- name: SECOM_SIGNING_IDENTITY_PATH
  value: /conf/signing_identity_keystore.jks
- name: SECOM_SIGNING_IDENTITY_PASSWORD
  valueFrom:
    secretKeyRef:
      name: mc-service-registry-secrets
      key: secom_signing_identity_keystore_password
- name: CONTEXT_PATH
  value: /msr

livenessProbe:
  httpGet:
    path: /msr/actuator/health/liveness
    port: http
  initialDelaySeconds: 30   # Wait 30s before first check
  periodSeconds: 10
  failureThreshold: 12       # Allow up to 30 + (12 * 10) = 150s total startup time
  timeoutSeconds: 5
readinessProbe:
  httpGet:
    path: /msr/actuator/health/readiness
    port: http
  initialDelaySeconds: 30   # Wait 30s before first check
  periodSeconds: 10
  failureThreshold: 12       # Allow up to 30 + (12 * 10) = 150s total startup time
  timeoutSeconds: 5

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes:
- name: config-volume
  projected:
    sources:
    - secret:
        name: mc-service-registry-secrets
        items:
        - key: secom_truststore
          path: secom_truststore.jks
    - secret:
        name: mc-service-registry-secrets
        items:
        - key: own_edge_router_keystore
          path: own_edge_router_keystore.jks
    - secret:
        name: mc-service-registry-secrets
        items:
        - key: secom_signing_identity_keystore
          path: signing_identity_keystore.jks

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
- name: config-volume
  mountPath: "/conf"
  readOnly: true

nodeSelector: {
  "kubernetes.io/os": linux
}

tolerations: []

affinity: {}
