{{- if and .Values.ingress.enabled .Values.ingress.clientCertificate.enabled }}
{{- if not .Values.ingress.clientCertificate.existingSecret }}
{{- /*
ingress-nginx reads exactly two keys out of the Secret named by
auth-tls-secret: ca.crt becomes ssl_client_certificate and ca.crl, when
present, becomes ssl_crl. The Secret has to live in the release namespace -
auth-tls-secret takes a namespace/name pair, but the controller only follows a
reference out of the Ingress' own namespace unless it was started with
--allow-cross-namespace-resources.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp.fullname" . }}-client-ca
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ required "ingress.clientCertificate.caChain is required when ingress.clientCertificate.enabled is true, unless existingSecret is set" .Values.ingress.clientCertificate.caChain | b64enc | quote }}
  {{- with .Values.ingress.clientCertificate.crl }}
  ca.crl: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
