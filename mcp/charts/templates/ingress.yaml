{{- if .Values.ingress.enabled -}}
{{- $fullName := include "mcp.fullname" . -}}
{{- $pathType := semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion -}}
{{- $className := semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion -}}
{{- $networkingV1 := semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
{{- $annotations := deepCopy (default dict .Values.ingress.annotations) -}}
{{- if and .Values.ingress.className (not $className) }}
  {{- if not (hasKey $annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set $annotations "kubernetes.io/ingress.class" .Values.ingress.className }}
  {{- end }}
{{- end }}
{{- /*
Everything below renders one Ingress per entry in $ingresses. The second entry
exists because ssl-redirect and force-ssl-redirect are per-Ingress annotations
in ingress-nginx: a path can only opt out of the https redirect by sitting on
its own Ingress object, so ingress.plainHttpPaths cannot simply be folded into
the host paths above. It inherits the same annotations so rewrite-target and
use-regex cannot drift, with the redirects turned off and the cert-manager
issuer dropped - the certificate is owned by the main ingress and a second
issuer annotation would order a duplicate. It also carries no tls block: the
locations merge into the same nginx server, which already terminates TLS from
the main ingress, so those paths keep working over https as well as http.
*/ -}}
{{- $ingresses := list (dict "name" $fullName "annotations" $annotations "hosts" .Values.ingress.hosts "tls" .Values.ingress.tls) -}}
{{- if .Values.ingress.plainHttpPaths -}}
  {{- $plainAnnotations := deepCopy $annotations -}}
  {{- $_ := unset $plainAnnotations "cert-manager.io/cluster-issuer" -}}
  {{- $_ := unset $plainAnnotations "cert-manager.io/issuer" -}}
  {{- $_ := set $plainAnnotations "nginx.ingress.kubernetes.io/ssl-redirect" "false" -}}
  {{- $_ := set $plainAnnotations "nginx.ingress.kubernetes.io/force-ssl-redirect" "false" -}}
  {{- $plainHosts := list -}}
  {{- range .Values.ingress.hosts -}}
    {{- $plainHosts = append $plainHosts (dict "host" .host "paths" $.Values.ingress.plainHttpPaths) -}}
  {{- end -}}
  {{- $ingresses = append $ingresses (dict "name" (printf "%s-plain-http" $fullName) "annotations" $plainAnnotations "hosts" $plainHosts "tls" list) -}}
{{- end -}}
{{- range $index, $ingress := $ingresses }}
{{- if $index }}
---
{{- end }}
{{- if $networkingV1 }}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" $.Capabilities.KubeVersion.GitVersion }}
apiVersion: networking.k8s.io/v1beta1
{{- else }}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ $ingress.name }}
  labels:
    {{- include "mcp.labels" $ | nindent 4 }}
  {{- with $ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and $.Values.ingress.className $className }}
  ingressClassName: {{ $.Values.ingress.className }}
  {{- end }}
  {{- if $ingress.tls }}
  tls:
    {{- range $ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- if and .pathType $pathType }}
            pathType: {{ .pathType }}
            {{- end }}
            backend:
              {{- if $networkingV1 }}
              service:
                name: {{ $.Release.Name }}-{{ .serviceName }}
                port:
                  number: {{ .servicePort }}
              {{- else }}
              serviceName: {{ $.Release.Name }}-{{ .serviceName }}
              servicePort: {{ .servicePort }}
              {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
