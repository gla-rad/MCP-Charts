  # Common Variables
  #
  keycloak_url: "http://localhost/mcp"
  keycloak_realm: "MCP"

  #
  # Per Child-Chart
  #

  # The MCP Keycloak Chart
  mc_keycloak:
    #
    # Input Files
    # 
    keystore: ""
    truststore: ""
    #
    # Credentials
    #
    db_username: "admin"
    db_password: "changeit"
    admin_username: "admin"
    admin_password: "changeit"
    keystore_password: "changeit"
    truststore_password: "changeit"
    #
    # Other Configuration
    #
    db_type: "postgres"
    db_url: "jdbc:postgresql://localhost/keycloak_mcp"
    auth_url: "http://localhost/mcp/auth"
    admin_url: "http://localhost/mcp/auth"
    mir_url: "http://localhost/mcp/mir"

  # The Identity Registry Chart
  mc_identity_registry:
    #
    # Input Files
    #
    configuration: ""
    keycloak_json: ""
    keystore: ""
    truststore: ""
    #
    # Credentials
    #
    db_username: ""
    db_password: ""
    #
    # Other Configuration
    #
    db_url: ""

  # The Service Registry Chart
  mc_service_registry:
    #
    # Input Files
    #

    #
    # Credentials
    #
    db_username: "admin"
    db_password: "changeit"
    keycloak_client_secret: "changeit"
    #
    # Other Configuration
    #
    db_type: "postgresql"
    db_host: "localhost"
    db_port: 5432
    db_name: "mcp_service_registry"
    keycloak_client_id: "mcpsvreg"
    mir_api_url: "http://localhost/mcp/mir/oidc/api"
  
  # The MMS Router Chart
  mc_mms_router:
    #
    # Input Files
    #
    private_key: ""
    certificate: ""
    certificate_key: ""
    client_ca: ""
    beacons: ""

    #
    # Credentials
    #
    
    #
    # Other Configuration
    #
    port: 8080
    port_libp2p: 9000

  # The MMS Edge Router Chart
  mc_mms_edge_router:
    #
    # Input Files
    #
    client_certificate: ""
    client_certificate_key: ""
    certificate: ""
    certificate_key: ""
    client_ca: ""

    #
    # Credentials
    #
    
    #
    # Other Configuration
    #
    port: 8080
    #mrn: "urn:mrn:mcp:device:idp1:org1:er"
    router_address: "localhost:8080"

  # The MCP Management Portal Chart
  mcp_management_portal:
    #
    # Input Files
    #

    #
    # Credentials
    #
    
    #
    # Other Configuration
    #
    name: "MCP Testbed"
    title: "MCP Testbed - Test Environment"
    identity_provider_mrn_namespace: "mcp"
    identity_registry_url: "https://localhost/mcp/mir"
    identity_registry_provider: "Maritime Connectivity Platform"
    identity_registry_email: "test@email.org"
    service_registry_url: "https://mcp.grad-rrnav.pub/mcp/msr"
    service_registry_provider: "Maritime Connectivity Platform"
    service_registry_email: "test@email.org"
    management_portal_provider: "Maritime Connectivity Platform"
    management_portal_email: "test@email.org"


serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""


# The ingress is defined in the top level
ingress:
  enabled: true
  name: mcp-ingress
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/rewrite-target: /$1$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Answer every plain HTTP request on port 80 with a 308 to the https URL.
    # ingress-nginx already does this once mcp-tls has issued, but force- makes
    # it unconditional so there is no window where http is served for real.
    # cert-manager's ACME solver ingress is separate and sets ssl-redirect
    # false on itself, so HTTP-01 challenges are unaffected.
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Switch to letsencrypt-prod once a staging certificate has issued
    # cleanly, then delete the mcp-tls secret to force a fresh request.
    # Staging certificates are untrusted, so the Java services will reject
    # the chain until this is on prod.
    cert-manager.io/cluster-issuer: letsencrypt-staging
  hosts:
    - host: chart-example.local
      paths:
        # Serves the Angular portal from the root. The app is built with
        # <base href="/">, so it requests /assets/... and /main.js unprefixed;
        # those only resolve if the portal owns the root path.
        - path: /()(.*)
          pathType: ImplementationSpecific
          serviceName: mcp-management-portal
          servicePort: 4200
        - path: /(auth)(/.*)?$
          pathType: ImplementationSpecific
          serviceName: mc-keycloak
          servicePort: 8090
        - path: /(mir)(/.*)?$
          pathType: ImplementationSpecific
          serviceName: mc-identity-registry
          servicePort: 8443
        - path: /(msr)(/.*)?$
          pathType: ImplementationSpecific
          serviceName: mc-service-registry
          servicePort: 8444
        - path: /(mms)(/.*)?$
          pathType: ImplementationSpecific
          serviceName: mc-mms-router
          servicePort: 8080
        - path: /(mms-p2p)(/.*)?$
          pathType: ImplementationSpecific
          serviceName: mc-mms-router
          servicePort: 9000
        - path: /(mms-edge)(/.*)?$
          pathType: ImplementationSpecific
          serviceName: mc-mms-edge-router
          servicePort: 8080
        - path: /(mms-edge-p2p)(/.*)?$
          pathType: ImplementationSpecific
          serviceName: mc-mms-edge-router
          servicePort: 9000
  # Paths exempt from the https redirect, rendered as a separate Ingress by
  # ingress-plain-http.yaml. MIR publishes its CRL and OCSP endpoints inside
  # issued certificates as http:// URLs, and PKI clients do not follow
  # redirects: Java's revocation checker POSTs the OCSP request and treats a
  # 308 as a network error. The responses are CA-signed, so serving them over
  # plain http is both safe and what RFC 5280 expects.
  plainHttpPaths:
    - path: /(mir)(/x509/api/certificates/ocsp/.*)$
      pathType: ImplementationSpecific
      serviceName: mc-identity-registry
      servicePort: 8443
    - path: /(mir)(/x509/api/certificates/crl/.*)$
      pathType: ImplementationSpecific
      serviceName: mc-identity-registry
      servicePort: 8443
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
