# Default values for mcp.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:

  #
  # Common Variables
  #
  keycloak_url: "http://localhost/mcp"
  keycloak_realm: "MCP"

  #
  # Per Child-Chart
  #

  # The MCP Keycloak Chart
  mc_keycloak:
